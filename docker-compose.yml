name: valletcontrol

services:
  postgres:
    image: postgres:16-alpine
    container_name: valletcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: valletcontrol
      POSTGRES_PASSWORD: valletcontrol
      POSTGRES_DB: valletcontrol
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valletcontrol -d valletcontrol']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
