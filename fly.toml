# fly.toml app configuration file generated for valletcontrol-api on 2026-09-20T21:47:12-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'valletcontrol-api'
primary_region = 'gru'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = "sh -c 'cd /app/apps/api && npx prisma migrate deploy'"

[env]
  API_PORT = '3001'
  API_PREFIX = 'api'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[services]]
  protocol = 'tcp'
  internal_port = 3001
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 9091
  path = '/metrics'
